<!DOCTYPE html>
<html lang="es" data-theme="camel">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camellos vs Enanos Player</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/theme-light-camel.css">
    <link rel="stylesheet" href="css/theme-dark-dwarf.css">

    <!-- Scripts con defer para que carguen después del HTML -->
    <script src="js/theme.js" defer></script>
    <script src="js/app.js" defer></script>

    <!-- Scripts con defer para que carguen después del HTML -->
    <script src="js/api.js" defer></script>
    <script src="js/ui-library.js" defer></script>
</head>
</head>
<body class="app-layout">

<!-- Encabezado superior -->
<header class="glass-panel main-header">
    <h1>🐫 Carreras Legendarias 🧔🏻‍♂️</h1>
    <button id="toggle-theme-btn" class="btn" onclick="toggleTheme()">⛏️ Modo Enano</button>
</header>

<!-- Barra lateral -->
<aside class="glass-panel sidebar">
    <nav>
        <ul style="list-style: none;">
            <li><button class="btn w-100 active">Biblioteca</button></li>
            <li><button class="btn w-100">Favoritas</button></li>
            <li><button class="btn w-100">Historial</button></li>
        </ul>
    </nav>
</aside>

<!-- Contenido Principal -->
<main class="main-content">
    <!-- Contenedor vacío para listar canciones -->
    <section id="library-list" class="glass-panel card flex-grow">
        <!-- JS inyectará la tabla/lista aquí -->
        <p>La biblioteca está vacía.</p>
    </section>

    <!-- Contenedor vacío para visualizar la estructura de datos -->
    <section id="structure-view" class="glass-panel card">
        <!-- JS dibujará la lista circular, cola o árbol aquí -->
    </section>

    <!-- Panel Inferior: Controles y Canción Actual -->
    <section id="current-song-panel" class="glass-panel player-controls-panel">
        <div class="song-info">
            <h3>Sin reproducir</h3>
            <p>---</p>
        </div>

        <div class="transport-controls">
            <button class="btn">⏮</button>
            <button class="btn">▶</button>
            <button class="btn">⏭</button>
        </div>

        <!-- Contenedor vacío para el selector de modo -->
        <div id="mode-selector">
            <select class="btn">
                <option value="RANDOM_CIRCULAR">Aleatorio (Circular)</option>
                <option value="FIFO_QUEUE">Llegada (Cola)</option>
                <option value="ALPHABETICAL_BST">Alfabético (Árbol)</option>
            </select>
        </div>
    </section>
</main>

<!-- Modal Formularios Glass -->
<div id="song-modal" class="modal-overlay glass-panel" style="display: none;">
    <div class="modal-content card glass-panel">
        <h2 id="modal-title">Agregar Canción</h2>
        <form id="song-form" onsubmit="UILibrary.handleFormSubmit(event)">
            <input type="hidden" id="song-id">

            <input type="text" id="song-name" placeholder="🎵 Nombre (Obligatorio)" class="glass-input" required>
            <input type="text" id="song-artist" placeholder="👤 Artista (Obligatorio)" class="glass-input" required>

            <div style="display: flex; gap: 10px;">
                <input type="text" id="song-album" placeholder="Álbum" class="glass-input">
                <input type="text" id="song-genre" placeholder="Género" class="glass-input">
            </div>

            <div style="display: flex; gap: 10px;">
                <input type="number" id="song-duration" placeholder="Duración (seg)" class="glass-input">
                <input type="number" id="song-year" placeholder="Año" class="glass-input">
                <input type="number" id="song-rating" placeholder="⭐ Rating (0-100)" class="glass-input" min="0" max="100">
            </div>

            <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                <button type="button" class="btn" onclick="UILibrary.closeModal()">Cancelar</button>
                <button type="submit" class="btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
